name: Verify Lean proof

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain manager
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Build proof
        run: lake build
      - name: Audit theorem axioms
        run: |
          set -o pipefail
          lake env lean Audit.lean | tee axiom-audit.log
          python3 scripts/check_axioms.py axiom-audit.log
      - name: Preserve build inputs and audit
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: |
            lake-manifest.json
            lean-toolchain
            axiom-audit.log
